workflows:
  android-workflow:
    name: Capacitor Android Build

    environment:
      node: latest

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Build web app
        script: |
          npm run build

      - name: Sync Capacitor
        script: |
          npx cap sync android

      - name: Build APK
        script: |
          cd android
          chmod +x gradlew || true
          ./gradlew assembleRelease

    artifacts:
      - android/app/build/outputs/**/*.apk
